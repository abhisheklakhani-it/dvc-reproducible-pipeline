[project]
name = "gridload"
version = "0.1.0"
description = "Day-ahead forecast of German electricity demand (SMARD) as a reproducible DVC pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dvc>=3.60",
    "holidays>=0.60",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
