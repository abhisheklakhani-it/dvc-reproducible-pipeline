name: Pipeline report

# On every pull request: pull the data from the DVC remote, rerun the stages
# whose inputs changed, and post params + metrics diffs against main as a comment.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  report:
    name: dvc repro + CML comment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # dvc compares against origin/main
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: iterative/setup-cml@e5f9f4673e0a8f275c45cc66dbbfd29c8469fb4e # v2.1.0
        with:
          version: "0.20.6"
      - name: Install locked dependencies
        run: uv sync --locked --no-dev
      - name: Pull data and cached stage outputs from DagsHub
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # DagsHub needs a signed-in user even for public repos; the token
          # goes into .dvc/config.local on the runner, never into git.
          uv run dvc remote modify origin --local auth basic
          uv run dvc remote modify origin --local user abhisheklakhani-it
          uv run dvc remote modify origin --local password "$DAGSHUB_TOKEN"
          uv run dvc pull --allow-missing
      - name: Reproduce the pipeline
        run: uv run dvc repro
      # CML's image host (asset.cml.dev) no longer works, so the plots go to
      # the run as a downloadable artifact and the comment links to it.
      - name: Upload plots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plots
          path: reports/figures/*.png
      - name: Post report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Pipeline report"
            echo
            echo "Rerun with \`dvc repro\` on this branch, compared with \`main\`."
            echo
            echo "### Params changed"
            uv run dvc params diff origin/main --md
            echo
            echo "### Metrics changed"
            uv run dvc metrics diff origin/main --md --precision 3
            echo
            echo "### Plots"
            echo "Test week and error by hour on this branch: \`plots\` artifact of [this run]($RUN_URL)."
          } > report.md
          cml comment create --no-publish --watermark-title="dvc-pipeline-report" report.md
